<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<style>
        h1 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        body {
            background-image: url(https://obmontessori.orangeapps.ph/landing/obmontessori/images/Greenhills%20Facade.jpg);
            background-size: cover;
        }

      .navbar-nav {
      margin-right: auto !important;
        }   

      .navbar form {
  margin-left: auto !important;
      }

    </style>
    
    <title>Enrollment</title>
</head>
<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
        <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-65/school_profile/1789004299-2727.png" height="50px" width="50px">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Enroll Now</a>
        </li>
      </ul>
       <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    </div>
  </nav>

         <main class="enrollment-hero py-5"></main>
        <h1>OBMC Student Enrollment Form</h1>
        <p class="mb-0">Fill out the form below to enroll for the upcoming school year</p>
    <div class="container">
      <div class="text-center text-white mb-3">
        </div>

      <div class="form-card bg-light shadow mt-4 p-4 mx-auto">
        <form>
          <h2>Student Information</h2>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" id="firstName" class="form-control" placeholder="John" required />
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" id="lastName" class="form-control" placeholder="Doe" required />
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label for="birthDate" class="form-label">Birth Date</label>
              <input type="date" id="birthDate" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="gender" class="form-label">Gender</label>
              <select id="gender" class="form-select" required>
                <option value="" selected disabled>Select...</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="gradeLevel" class="form-label">Grade Level</label>
              <select id="gradeLevel" class="form-select" required>
                <option value="" selected disabled>Select...</option>
                <option value="Junior Casa">Junior Casa</option>
                <option value="Junior-Advanced Casa">Junior-Advanced Casa</option>
                <option value="Advanced Casa">Advanced Casa</option>
                <option value="Grade 1">Grade 1</option>
                <option value="Grade 2">Grade 2</option>
                <option value="Grade 3">Grade 3</option>
                <option value="Grade 4">Grade 4</option>
                <option value="Grade 5">Grade 5</option>
                <option value="Grade 6">Grade 6</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
                <option value="Grade 11">Grade 11</option>
                <option value="Grade 12">Grade 12</option>
              </select>
            </div>
          </div>

          <h2>Contact Details</h2>
          <div class="mb-3">
            <label for="emailAddress" class="form-label">Email Address</label>
            <input type="email" id="emailAddress" class="form-control" placeholder="student@example.com" required />
          </div>
          <div class="mb-4">
            <label for="contactNumber" class="form-label">Contact Number</label>
            <input type="tel" id="contactNumber" class="form-control" placeholder="0912-345-6789" required />
          </div>

          <h2>Other Information</h2>
          <div class="mb-3">
            <label class="form-label d-block">Mode of Learning</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="learningMode" id="modeOnline" value="Online" required />
              <label class="form-check-label" for="modeOnline">Online</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="learningMode" id="modeF2F" value="Face-to-Face" />
              <label class="form-check-label" for="modeF2F">Face-to-Face</label>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="confirmInfo" required />
            <label class="form-check-label" for="confirmInfo">
              I confirm that the information provided is true and complete.
            </label>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Submit Enrollment</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
  <div class="container">
    <p class="mb-0">© 2026 OB Montessori. All rights reserved.</p>
  </div>
</footer> 
</body>
</html>
